# Blueprint do Render — permite ligar o repositório e o Render propor
# automaticamente esta configuração, em vez de preencheres tudo à mão.
# Ver: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: loadmonitor-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Assistente de IA (Claude). A chave é secreta — o Render pede-a no painel
      # (sync: false), não fica no repositório. Sem ela, a página /assistente
      # abre mas responde que não está configurada.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Opcional: modelo usado pela assistente. Por omissão claude-haiku-4-5.
      - key: ANTHROPIC_MODEL
        sync: false
