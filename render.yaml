# Blueprint do Render — permite ligar o repositório e o Render propor
# automaticamente esta configuração, em vez de preencheres tudo à mão.
# Ver: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: loadmonitor-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Mensagens aos jogadores (WhatsApp via Twilio). Sem estas variáveis a
      # página Mensagens funciona em modo simulação (links para partilhar à mão).
      - key: APP_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_TEMPLATE_WELLNESS
        sync: false
      - key: TWILIO_TEMPLATE_PSE
        sync: false
      # Segredo partilhado com o workflow .github/workflows/mensagens.yml.
      - key: CRON_SECRET
        sync: false
