name: Keep Apps Awake

# Dois relógios diferentes porque cada serviço hiberna a ritmos diferentes:
# - Streamlit Cloud hiberna só ao fim de >12h sem tráfego -> basta 1 ping/6h.
# - Render (plano free) hiberna ao fim de ~15min sem tráfego -> precisa de
#   ping frequente para nunca chegar a adormecer.

on:
  schedule:
    # Commit vazio + ping ao Streamlit — a cada 6 horas.
    - cron: '0 */6 * * *'
    # Ping à API no Render — a cada 10 minutos, para nunca hibernar.
    - cron: '*/10 * * * *'
  # Permite correr manualmente a partir do GitHub Actions UI
  workflow_dispatch:

jobs:
  keep-alive:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Make empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive ping $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Ping Streamlit app
        run: |
          # HTTP ping adicional ao URL público — não substitui o commit,
          # mas adiciona traffic signal extra ao Streamlit Cloud.
          curl -fsSL -o /dev/null -w "Ping status: %{http_code}\n" \
            https://loadmonitorsystem.streamlit.app || true

  ping-api:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI (Render)
        run: |
          curl -fsSL -o /dev/null -w "API ping status: %{http_code}\n" \
            https://loadmonitor-api-bp5m.onrender.com/api/health || true
