name: Keep API Awake

# O Render (plano free) hiberna a API ao fim de ~15 min sem tráfego: um ping a
# cada 5 minutos evita o arranque lento (30–50 s) na primeira página. O GitHub
# atrasa muitas vezes os agendamentos; para garantia total, usar também um
# serviço externo (ex.: cron-job.org) a cada 5 min — ou passar a um plano pago.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI (Render)
        run: |
          curl -fsSL -o /dev/null -w "API ping status: %{http_code}\n" \
            https://loadmonitor-api-bp5m.onrender.com/api/health || true
