name: Mensagens aos jogadores

# Envios automáticos por WhatsApp: bem-estar de manhã, PSE depois das sessões
# e lembrete a quem não respondeu. Corre de 15 em 15 minutos das 04:00 às
# 22:45 UTC; a API decide, para cada equipa (na hora local do fuso escolhido),
# o que já toca enviar — e nunca envia duas vezes ao mesmo jogador no mesmo dia.
#
# Requer o segredo CRON_SECRET em Settings → Secrets and variables → Actions,
# com o mesmo valor da variável CRON_SECRET da API no Render.

on:
  schedule:
    - cron: '*/15 4-22 * * *'
  workflow_dispatch:

jobs:
  envios-automaticos:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir à API os envios que já tocam
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não está definido — envio automático desligado."
            exit 0
          fi
          curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://loadmonitor-api-bp5m.onrender.com/api/cron/mensagens
