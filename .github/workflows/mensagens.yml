name: Mensagens aos jogadores

# Envia o questionário de bem-estar da manhã por WhatsApp. Corre de 15 em 15
# minutos durante a manhã; a API decide, para cada equipa, se já passou a hora
# configurada (hora de Lisboa) e se hoje é dia de envio — e nunca envia duas
# vezes ao mesmo jogador no mesmo dia. 05:00–10:45 UTC = 05:00–10:45 em Lisboa
# no inverno e 06:00–11:45 no verão.
#
# Requer o segredo CRON_SECRET em Settings → Secrets and variables → Actions,
# com o mesmo valor da variável CRON_SECRET da API no Render.

on:
  schedule:
    - cron: '*/15 5-10 * * *'
  workflow_dispatch:

jobs:
  bem-estar-da-manha:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir à API o envio da manhã
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não está definido — envio automático desligado."
            exit 0
          fi
          curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://loadmonitor-api-bp5m.onrender.com/api/cron/mensagens
