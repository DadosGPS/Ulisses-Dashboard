name: CI

# Corre os testes da API e o typecheck + build do frontend em cada push e em
# cada pull request para main. Uma verificação verde antes de mergar evita que
# uma alteração parta a app sem ninguém dar por isso.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
      - name: Correr testes
        run: pytest api/tests -q
        env:
          PYTHONPATH: api:.

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          # Placeholders — o build não liga a serviços reais, só precisa que as
          # variáveis NEXT_PUBLIC_* existam.
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
