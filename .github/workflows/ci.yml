name: CI

# Corre os testes da API e o typecheck + build do frontend em cada push e em
# cada pull request para main. Uma verificação verde antes de mergar evita que
# uma alteração parta a app sem ninguém dar por isso.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
      - name: Correr testes
        run: pytest api/tests -q
        env:
          PYTHONPATH: api:.

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          # Placeholders — o build não liga a serviços reais, só precisa que as
          # variáveis NEXT_PUBLIC_* existam.
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  e2e:
    name: Web · testes das páginas
    # Abre as páginas principais num browser a sério, com a API, uma base de
    # dados de teste (migrações + dados fictícios) e um login simulado.
    # Ver e2e/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: |
          pip install -r api/requirements.txt
          (cd web && npm ci && npx playwright install --with-deps chromium)
      - name: Base de dados de teste
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f e2e/supabase_stub.sql
          python scripts/aplicar_migracoes.py
          python e2e/semear.py
      - name: Arrancar o login simulado e a API
        run: |
          python e2e/auth_falso.py 54321 > e2e-auth.log 2>&1 &
          (cd api && SUPABASE_URL=http://127.0.0.1:54321 CORS_ORIGINS=http://localhost:3000 \
            nohup uvicorn main:app --port 8000 > ../e2e-api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Construir e arrancar a web
        working-directory: web
        run: |
          npx next build
          nohup npx next start -p 3000 > ../e2e-web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - name: Testes das páginas
        working-directory: web
        run: npx playwright test
      - name: Guardar relatório (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-paginas
          path: |
            web/playwright-report
            web/test-results
            e2e-*.log
          retention-days: 7
