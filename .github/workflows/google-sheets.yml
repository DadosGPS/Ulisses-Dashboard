name: PSE do Google Sheets

# Importa de hora a hora (06–22 UTC) a PSE das folhas do Google Sheets ligadas
# às equipas (página Importar → Google Sheets). A API lê cada folha e grava só
# a PSE/PSE esperada a partir da data de início escolhida.
#
# Usa o mesmo segredo CRON_SECRET do workflow das mensagens.

on:
  schedule:
    - cron: '17 6-22 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir à API para sincronizar as folhas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não está definido — sincronização automática desligada."
            exit 0
          fi
          curl -fsS --max-time 300 -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            https://loadmonitor-api-bp5m.onrender.com/api/cron/google-sheets
